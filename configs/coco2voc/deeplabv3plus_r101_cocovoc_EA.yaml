MODEL:
  NAME: "deeplabv3plus_resnet101"  # deeplabv2_resnet101 & deeplabv3plus_resnet101
  WEIGHTS: "https://download.pytorch.org/models/resnet101-5d3b4d8f.pth"
  FREEZE_BN: True
  NUM_CLASSES: 21
DATASETS:
  SOURCE_TRAIN: "coco_train"   # coco_train
  TARGET_TRAIN: "voc_train"
  TEST: "voc_val"
#  DEBUG: True
INPUT:
  SOURCE_INPUT_SIZE_TRAIN: (512, 512)
  TARGET_INPUT_SIZE_TRAIN: (512, 512)
  INPUT_SIZE_TEST: (512, 512)
SOLVER:
  BASE_LR: 2.5e-4
  MAX_ITER: 6250
  STOP_ITER: 4000
  BATCH_SIZE: 2
  CONSISTENT_LOSS: 0.1
  NEGATIVE_LOSS: 1.0
  NEGATIVE_THRESHOLD: 0.05
ACTIVE:
  NAME: 'AL-RIPU'
  SETTING: 'EA'
  SELECT_ITER: [40, 80, 120, 160, 200]
  # RATIO: 0.05
  # RADIUS_K: 1
  # DEBUG: 1